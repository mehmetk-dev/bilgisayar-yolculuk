<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robo ile Kodlama</title>
<style>
:root {
  --bg: #fff6e6;
  --card: #ffffff;
  --fg: #2b2340;
  --mut: #6b6380;
  --line: #eadcc2;
  --acc: #7a5cff;
  --ok: #1f9d55;
  --ok-bg: #e3f8ea;
  --bad: #c93a3a;
  --bad-bg: #ffe9e6;
  --warn-bg: #fff1cc;
  --c: var(--acc);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg) radial-gradient(#f3e3c4 1.5px, transparent 1.6px) 0 0 / 26px 26px;
  color: var(--fg);
  font: 18px/1.5 "Nunito", "Segoe UI", "Noto Sans", "DejaVu Sans", Arial, sans-serif;
  display: flex; flex-direction: column;
}
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0.4em 0; }
.mut { color: var(--mut); font-size: 0.9em; }
button, .btn {
  font: inherit; font-weight: 700; color: var(--fg); background: #fff; border: 2px solid var(--line); border-radius: 14px;
  padding: 0.4em 0.9em; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.35em;
  box-shadow: 0 3px 0 var(--line); transition: transform 0.08s;
}
button:hover, .btn:hover { border-color: var(--c); }
button:active, .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
button:disabled { cursor: default; }
.primary { background: var(--c); border-color: var(--c); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--c), #000 30%); }
.primary:hover { filter: brightness(1.08); }
.big { font-size: 1.15em; padding: 0.55em 1.2em; border-radius: 16px; }
button.link { background: none; border: 0; box-shadow: none; color: var(--acc); text-decoration: underline; padding: 0.1em; font-weight: 600; }
.shake { animation: shake 0.4s; }
.pop { animation: pop 0.35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(0.85); opacity: 0.4; } 60% { transform: scale(1.04); } }

/* üst çubuk */
#top { display: flex; align-items: center; gap: 0.6em; padding: 0.45em 1em; background: #fff; border-bottom: 3px solid #f0e2c6; flex-wrap: wrap; flex: none; }
#top .btn, #top button { font-size: 0.8em; padding: 0.3em 0.7em; }
.brand { font-weight: 900; font-size: 1.2em; color: var(--fg); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--acc); }
#crumb { color: var(--mut); font-weight: 700; }
#crumb:not(:empty)::before { content: "›"; margin-right: 0.5em; }
.sp { flex: 1; }
#map, #lesson { flex: 1; overflow-y: auto; padding: 1.2em 16px 3em; }

/* Robo karakteri */
.robo { overflow: visible; }
.robo .ant line { stroke: #35506b; stroke-width: 3; stroke-linecap: round; }
.robo .bulb { fill: #ff5d8f; animation: glow 1.6s ease-in-out infinite; }
.robo .arm rect, .robo .arm circle { fill: #ffb547; stroke: #c9802a; stroke-width: 2; }
.robo .arm { transform-box: fill-box; }
.robo .arm-l { transform-origin: 100% 50%; }
.robo .arm-r { transform-origin: 0% 50%; }
.robo .wheel { fill: #35506b; }
.robo .body { fill: #ffb547; stroke: #c9802a; stroke-width: 3; }
.robo .heart { fill: #ff5d8f; animation: glow 1.2s ease-in-out infinite; }
.robo .head { fill: #6cc9ff; stroke: #2a86c4; stroke-width: 3; }
.robo .face { fill: #1d3557; }
.robo .eye circle:first-child { fill: #fff; }
.robo .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
.robo .pup { fill: #1d3557; transition: transform 0.3s; }
.robo .mouth { fill: none; stroke: #7ff0ff; stroke-width: 3; stroke-linecap: round; }
.robo .frown { display: none; }
.robo .cheek { fill: #ff8fb1; opacity: 0.8; }
@keyframes glow { 50% { opacity: 0.45; } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

.sbot { width: 9em; flex: none; }
.sbot .robo { width: 100%; display: block; }
.sbot.wave .arm-r { animation: wave 0.9s ease-in-out infinite; }
.sbot.wave .robo, .sbot.think .robo { animation: float 3s ease-in-out infinite; }
.sbot.think .robo { transform-origin: 50% 90%; animation: tilt 2.4s ease-in-out infinite; }
.sbot.think .bulb { animation: glow 0.5s infinite; }
.sbot.dance .robo { transform-origin: 50% 95%; animation: dance 0.8s ease-in-out infinite; }
.sbot.dance .arm-l { animation: wave 0.4s ease-in-out infinite alternate-reverse; }
.sbot.dance .arm-r { animation: wave 0.4s ease-in-out infinite alternate; }
@keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-40deg); } }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes tilt { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes dance { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-10px); } }

/* harita (ana ekran) */
.mwrap { max-width: 56em; margin: 0 auto; }
.hero { display: flex; align-items: center; gap: 1.5em; background: linear-gradient(135deg, #7a5cff, #a35cff 55%, #ff8a3d); color: #fff; border-radius: 28px; padding: 1.4em 1.8em; box-shadow: 0 10px 30px #7a5cff44; margin-bottom: 1.8em; }
.hero h1 { font-size: 2em; font-weight: 900; }
.hero p { font-size: 1.05em; opacity: 0.95; max-width: 34em; }
.hero .btn { --c: #fff; color: #6a3df0; margin-top: 0.4em; box-shadow: 0 4px 0 #0003; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.1em; position: relative; }
.trail::before { content: ""; position: absolute; left: 1.75em; top: 1em; bottom: 1em; border-left: 6px dashed #e2cfa8; }
.node a, .node.soon { display: flex; align-items: center; gap: 1em; text-decoration: none; color: inherit; position: relative; }

.nnum { width: 3.5em; height: 3.5em; flex: none; border-radius: 50%; background: var(--c); color: #fff; font-weight: 900; font-size: 1.1em; display: grid; place-items: center; border: 5px solid #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--c), #000 25%), 0 6px 16px #0002; }
.node.done .nnum { background: var(--ok); }
.ncard { flex: 1; display: flex; gap: 0.9em; align-items: center; background: #fff; border: 3px solid color-mix(in srgb, var(--c), #fff 60%); border-radius: 20px; padding: 0.8em 1em; transition: transform 0.15s; }
.node a:hover .ncard { transform: translateX(6px) rotate(-0.5deg); border-color: var(--c); }
.nicon { font-size: 2.3em; line-height: 1; }
.ntxt { display: flex; flex-direction: column; gap: 0.15em; flex: 1; min-width: 0; }
.ntxt b { font-size: 1.2em; color: color-mix(in srgb, var(--c), #000 25%); }
.ntxt small { color: var(--mut); font-size: 0.88em; }
.nfoot { display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; margin-top: 0.3em; }
.chip { font-size: 0.75em; font-weight: 800; background: color-mix(in srgb, var(--c), #fff 85%); color: color-mix(in srgb, var(--c), #000 35%); border-radius: 999px; padding: 0.15em 0.7em; }
.nprog { flex: 1; min-width: 4em; max-width: 10em; height: 0.55em; background: #f1e9da; border-radius: 999px; overflow: hidden; }
.nprog i { display: block; height: 100%; background: var(--c); border-radius: 999px; }
.ncount { font-size: 0.75em; color: var(--mut); font-weight: 700; }
.node.soon { --c: #b9b0c9; opacity: 0.75; }
.whead { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 0.6em; flex-wrap: wrap; font-size: 1.25em; font-weight: 900; margin: 0.8em 0 -0.2em; padding: 0.3em 0.9em; background: var(--bg); border-radius: 14px; align-self: flex-start; }
.whead span { background: var(--fg); color: #fff; border-radius: 999px; padding: 0.1em 0.7em; font-size: 0.8em; }
.whead small { font-size: 0.6em; color: var(--mut); font-weight: 700; }
.trail .whead:first-child { margin-top: 0; }
.node.soon .ncard { border-style: dashed; }
.tnote { background: #fffdf6; border: 2px dashed #e0c98f; border-radius: 18px; padding: 0.9em 1.1em; margin-top: 1.8em; font-size: 0.92em; }
.tnote h3, .tnote h4 { margin-bottom: 0.3em; }

/* bölüm ekranı */
.lwrap { max-width: 74em; margin: 0 auto; display: flex; flex-direction: column; gap: 0.9em; }
.lbar { display: flex; align-items: center; gap: 0.7em; flex-wrap: wrap; }
.ltag { background: var(--c); color: #fff; font-weight: 900; border-radius: 999px; padding: 0.2em 0.9em; white-space: nowrap; }
.lbar h2 { font-size: 1.45em; font-weight: 900; color: color-mix(in srgb, var(--c), #000 30%); }
.dots { display: flex; flex-wrap: wrap; gap: 0.3em; margin-left: auto; }
.dot { width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; font-size: 0.8em; font-weight: 800; text-decoration: none; color: var(--mut); background: #fff; border: 2px solid var(--line); }
.dot.ok { background: color-mix(in srgb, var(--c), #fff 70%); border-color: var(--c); color: color-mix(in srgb, var(--c), #000 40%); }
.dot.cur { background: var(--c); border-color: var(--c); color: #fff; transform: scale(1.15); }
.stage { background: var(--card); border: 3px solid color-mix(in srgb, var(--c), #fff 65%); border-radius: 26px; padding: 1.3em; min-height: 22em; box-shadow: 0 8px 0 color-mix(in srgb, var(--c), #fff 80%); }
.lnav { display: flex; align-items: center; gap: 0.8em; }
.nhint { flex: 1; text-align: right; font-weight: 700; color: var(--bad); }
.go[aria-disabled="true"] { filter: grayscale(0.7); opacity: 0.55; }
.go.ready { animation: ready 1.4s ease-in-out infinite; }
@keyframes ready { 50% { transform: scale(1.06); box-shadow: 0 4px 0 color-mix(in srgb, var(--c), #000 30%), 0 0 0 8px color-mix(in srgb, var(--c), transparent 70%); } }
.chipb { display: inline-block; color: #fff; font-weight: 800; border-radius: 10px; padding: 0.05em 0.6em; white-space: nowrap; box-shadow: 0 2px 0 #0002; }

/* hikâye */
.story { display: flex; align-items: center; gap: 1.6em; min-height: 19em; padding: 0.5em 1em; }
.story .sbot { width: 12em; }
.bubble { flex: 1; position: relative; background: #f6f2ff; border: 3px solid #d8ccff; border-radius: 28px; padding: 1.2em 1.4em; font-size: 1.12em; animation: pop 0.4s; }
.bubble::before { content: ""; position: absolute; left: -22px; top: 50%; margin-top: -14px; border: 14px solid transparent; border-right: 22px solid #d8ccff; border-left: 0; }
.bubble h3 { font-size: 1.4em; font-weight: 900; margin-bottom: 0.4em; color: color-mix(in srgb, var(--c), #000 25%); }
.pics { display: flex; flex-wrap: wrap; gap: 0.3em; font-size: 2.2em; margin-top: 0.5em; }
.pics span { animation: hop 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.15s); display: inline-block; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
.tips { padding-left: 1.3em; margin: 0.3em 0; }
.tips li { margin: 0.35em 0; }

/* sıralama ve soru */
.act h3 { font-size: 1.4em; font-weight: 900; color: color-mix(in srgb, var(--c), #000 25%); }
.ahead { display: flex; gap: 1em; align-items: center; margin-bottom: 0.8em; }
.ahead .sbot { width: 6em; }
.slots { list-style: none; padding: 0; margin: 0 0 1em; display: grid; gap: 0.5em; }
.slots li { display: flex; align-items: center; gap: 0.7em; }
.num { width: 2.2em; height: 2.2em; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: color-mix(in srgb, var(--c), #fff 80%); color: color-mix(in srgb, var(--c), #000 30%); }
.sc { flex: 1; min-height: 2.6em; border: 3px dashed var(--line); border-radius: 14px; display: flex; align-items: center; gap: 0.5em; padding: 0.25em 0.8em; color: #cbbfa6; font-weight: 800; }
.fill .sc { border: 3px solid var(--ok); background: var(--ok-bg); color: var(--fg); animation: pop 0.35s; }
.fill .num { background: var(--ok); color: #fff; }
.pool { display: flex; flex-wrap: wrap; gap: 0.6em; padding: 0.9em; background: #fbf6ec; border-radius: 18px; min-height: 4em; }
.card { font-size: 1em; padding: 0.5em 0.9em; border-color: color-mix(in srgb, var(--c), #fff 50%); }
.ic { font-size: 1.4em; line-height: 1; }
.amsg { border-radius: 16px; padding: 0.7em 1em; border: 3px solid; margin-top: 0.9em; }
.amsg.ok { background: var(--ok-bg); border-color: var(--ok); color: #0d4a25; }
.amsg.bad { background: var(--bad-bg); border-color: #f0a199; color: #6e1d1d; }
.hint { margin-top: 0.5em; background: #fffbea; border: 2px dashed #e0b400; border-radius: 12px; padding: 0.4em 0.7em; color: #5a3600; }
.quiz { max-width: 44em; margin: 0 auto; text-align: center; }
.qpic { display: flex; justify-content: center; margin: 1em 0 0.4em; }
.qq { font-size: 1.25em; margin: 0.8em 0; }
.opts { display: flex; flex-direction: column; gap: 0.6em; max-width: 30em; margin: 0 auto; }
.opt { font-size: 1.1em; padding: 0.6em 1em; border-width: 3px; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); color: #0d4a25; animation: pop 0.35s; }
.opt.wrongopt { background: var(--bad-bg); border-color: #f0a199; opacity: 0.7; animation: shake 0.4s; }
.opt:disabled:not(.right):not(.wrongopt) { opacity: 0.5; }

/* bitiş */
.finish { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.8em; }
.finish .sbot { width: 9em; }
.badge { display: flex; align-items: center; gap: 0.5em; background: linear-gradient(135deg, #ffd23f, #ffb547); border: 4px solid #fff; box-shadow: 0 6px 0 #c9802a, 0 10px 20px #0002; border-radius: 999px; padding: 0.4em 1.4em; font-size: 1.3em; animation: pop 0.6s; }
.badge span { font-size: 1.5em; }
.finish h3 { font-size: 1.5em; font-weight: 900; }
.learned { background: #f6f2ff; border-radius: 18px; padding: 0.8em 1.2em; text-align: left; max-width: 36em; }
.learned ul { margin: 0.3em 0 0; padding-left: 1.2em; }
.finish .tnote { margin-top: 0; text-align: left; max-width: 36em; }
.fbtns { display: flex; flex-wrap: wrap; gap: 0.7em; justify-content: center; margin-top: 0.4em; }
.soon-txt { font-weight: 800; color: var(--mut); align-self: center; }

/* konfeti */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
#fx i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall-c 2.5s ease-in forwards; }
@keyframes fall-c { to { transform: translate(var(--dx), 110vh) rotate(var(--rz)); } }

@media (max-width: 40em) {
  body { font-size: 16px; }
  .hero { flex-direction: column; text-align: center; padding: 1.2em; }
  .hero .sbot { width: 7em; }
  .story { flex-direction: column; padding: 0; }
  .story .sbot { width: 8em; }
  .bubble::before { left: 50%; top: -22px; margin: 0 0 0 -14px; border: 14px solid transparent; border-bottom: 22px solid #d8ccff; border-top: 0; }
  .stage { padding: 0.9em; }
  .nnum { width: 2.8em; height: 2.8em; }
  .trail::before { left: 1.4em; }
  .ncard { flex-direction: column; align-items: flex-start; }
  .dots { margin-left: 0; }
  #top .brand { font-size: 1em; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

/* ızgara görevi yerleşimi */
.gridact { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(17em, 1fr); gap: 1em 1.4em; align-items: start; }
.gleft { display: flex; flex-direction: column; gap: 0.6em; min-width: 0; }
.ginfo h3 { font-size: 1.35em; font-weight: 900; color: color-mix(in srgb, var(--c), #000 25%); }
.gboard { padding: 0.8em 4px 1em; min-width: 0; overflow: hidden; }
.gcode { background: #faf7ff; border: 2px solid #e6dcff; border-radius: 20px; padding: 0.9em; display: flex; flex-direction: column; gap: 0.5em; }
.gcode h4 { font-size: 0.95em; color: var(--mut); display: flex; align-items: center; gap: 0.5em; }
.cnt { margin-left: auto; font-size: 0.85em; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 0 0.6em; }
.cnt.full { background: var(--warn-bg); border-color: #e0a100; color: #5a3600; }
@media (max-width: 52em) {
  .gridact { grid-template-columns: minmax(0, 1fr); }
}

/* komut renkleri */
.c-f { --k: #2fbf71; }
.c-b { --k: #ff8a3d; }
.c-l { --k: #2f8cff; }
.c-r { --k: #7a5cff; }
.c-loop { --k: #e0457b; }
.c-p { --k: #d99500; }
.c-fn { --k: #ff6680; }
.c-if { --k: #f08c00; }
.c-until { --k: #c2410c; }
.chipb, .tool, .blk { background: var(--k); }
.tools { display: flex; flex-wrap: wrap; gap: 0.45em; }
.tool { color: #fff; border: 0; font-size: 0.95em; padding: 0.5em 0.85em; box-shadow: 0 4px 0 color-mix(in srgb, var(--k), #000 30%); }
.tool:hover { filter: brightness(1.1); }
.tool:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--k), #000 30%); }
.bi { font-size: 1.25em; line-height: 1; min-width: 1em; text-align: center; }
.running .tools, .running .prog, .running .clear { opacity: 0.55; pointer-events: none; }

/* program alanı */
.prog { min-height: 9em; max-height: 34em; overflow-y: auto; background: #fff; border: 3px dashed #d4c6ff; border-radius: 16px; padding: 0.5em; display: flex; flex-direction: column; gap: 0.3em; cursor: text; }
.pempty { color: var(--mut); font-size: 0.85em; font-weight: 700; padding: 0.3em; }
.blk { touch-action: none; user-select: none; -webkit-user-select: none; display: flex; align-items: center; gap: 0.45em; color: #fff; font-weight: 800; border-radius: 12px; padding: 0.3em 0.4em 0.3em 0.6em; cursor: pointer; box-shadow: 0 3px 0 color-mix(in srgb, var(--k), #000 30%); transition: transform 0.15s, outline-color 0.15s; outline: 4px solid transparent; }
.blk:not(.box):hover { filter: brightness(1.08); }
.blk.new { animation: pop 0.3s; }
.blk.now { outline-color: #ffd23f; transform: translateX(6px) scale(1.03); }
.blk.extra { outline-color: #ff3d3d; animation: shake 0.4s 2; }
.del { margin-left: auto; background: #ffffff33; border: 0; box-shadow: none; color: #fff; font-size: 0.75em; padding: 0.15em 0.5em; border-radius: 8px; }
.del:hover { background: #00000033; }
.box { flex-direction: column; align-items: stretch; padding: 0; gap: 0; }
.lhead { display: flex; align-items: center; gap: 0.4em; padding: 0.3em 0.4em 0.3em 0.6em; flex-wrap: wrap; }
.lhead select { max-width: 100%; font: inherit; font-weight: 900; border: 0; border-radius: 8px; padding: 0 0.2em; color: var(--fg); cursor: pointer; }
.iter { font-size: 0.85em; background: #ffd23f; color: #5a3600; border-radius: 999px; padding: 0 0.5em; }
.iter:empty { display: none; }
.lbody { margin: 0 0.45em 0 1.5em; background: color-mix(in srgb, var(--k), #fff 88%); border: 2px dashed color-mix(in srgb, var(--k), #fff 50%); border-radius: 10px; padding: 0.4em; min-height: 3em; display: flex; flex-direction: column; gap: 0.3em; color: var(--fg); }
.lbody > .pempty { font-size: 0.8em; color: color-mix(in srgb, var(--k), #000 30%); text-align: center; padding: 0.4em; }
.lfoot { padding: 0.1em 0.7em 0.25em; font-size: 0.75em; font-weight: 700; opacity: 0.9; }
.lfoot:hover, .lmid:hover { text-decoration: underline; }
.lmid { padding: 0.2em 0.7em; font-weight: 800; cursor: pointer; }
.chk { font-size: 0.8em; border-radius: 999px; padding: 0 0.5em; background: #fff; }
.chk:empty { display: none; }
.chk.yes { color: var(--ok); }
.chk.no { color: var(--bad); }
.cv { background: #ffffff; color: var(--fg); border-radius: 8px; padding: 0 0.35em; font-weight: 900; }
.fnhead { color: #c2185b !important; }
.fnprog { border-color: #ffb3c4; background: #fff7f9; min-height: 5em; }
.caret { display: block; height: 5px; flex: none; border-radius: 3px; background: #ff3d7f; animation: caret 1s steps(2) infinite; }
@keyframes caret { 50% { opacity: 0.2; } }
.running .caret { visibility: hidden; }
.ctrl { display: flex; flex-wrap: wrap; gap: 0.45em; margin-top: 0.3em; }
.ctrl .run { --c: #2fbf71; font-size: 1.1em; flex: 1 1 100%; }
.ctrl button:not(.run) { flex: 1; font-size: 0.85em; }

/* tahta */
.board { --t: 64px; --dur: 450ms; position: relative; display: grid; grid-template-columns: repeat(var(--w), var(--t)); grid-auto-rows: var(--t); width: max-content; margin: 0 auto; border-radius: 16px; }
.tile { position: relative; }

, 1 kare ileri (yıldız), sonra 2 kez Geri git."},{type:"grid",title:"⭐ Bonus: Büyük yolculuk",text:"<p>Uzun ve kıvrımlı bir yol. Yolu parmağınla takip et, her köşede “Robo şimdi hangi yöne dönmeli?” diye düşün.</p>",map:["S.#*..","#.#.#.","#...#G"],dir:"E",tools:["F","L","R"],sol:"FRFFLFFLFFRFFRFF",hint:"Önce aşağı in, alttan sağa git, yıldıza çık, sonra en sağdan aşağı in."}]},Pa={icon:"🗝️",color:"#0ea5a4",title:"Önce Plan Yap",concept:"Planlama",desc:"Programcılar önce plan yapar. Anahtarı bul, kilitli kapıları aç, hazineye ulaş!",learned:["Programı yazmadan önce yolu planlamak hataları azaltır.","Bazı işlerin bir ön koşulu vardır: kapıdan geçmek için önce anahtar gerekir.","Programı “kafamızda çalıştırarak” sonucunu tahmin edebiliriz."],teacher:"<b>Kâğıt plan:</b> Kareli kâğıda 5×5 bir harita çizin; bir anahtar, bir kapı ve bir pil koyun. Öğrenciler yolu önce kalemle çizsin, sonra ok işaretleriyle (⬆ ↰ ↱) programını yazsın. Programları değiştirip arkadaşının programını “kafasında çalıştırsın”.",steps:[{type:"story",anim:"think",title:"Programcılar önce plan yapar 📝",text:"<p>Uzun bir yolculuğa çıkmadan önce haritaya bakarsın, değil mi? Programcılar da kod yazmadan önce <b>plan</b> yapar.</p><p>Bir plan: 1) Hedef nerede? 2) Yolda neler var? 3) Hangi sırayla gideceğim?</p>",pics:["🗺️","✏️","🤔","✅"]},{type:"quiz",title:"Programı kafanda çalıştır",pic:he(["S..","...","..."])+ke("FFRF"),q:"Robo bu programın sonunda hangi karede olur?",opts:["Sağ üst köşede","Sağ kenarın ortasında","Sağ alt köşede"],a:1,ok:"2 kare sağa, sağa dön (artık aşağı bakıyor), 1 kare aşağı: sağ kenarın ortası!"},{type:"quiz",title:"Hangi program doğru?",pic:he(["S..","##.","##G"]),q:"Robo sağa bakıyor. Hangi program onu pile götürür?",opts:[fe("FFRFF"),fe("FFLFF"),fe("FRFFF")],a:0,ok:"İki kare sağa, köşede sağa dön, iki kare aşağı."},{type:"story",anim:"wave",title:"Anahtar ve kapı 🔑🚪",text:"<p>Bazı yerlerde <b>kilitli kapılar</b> 🚪 var. Kapıdan geçmek için önce <b>anahtarı</b> 🔑 almalıyım.</p> rogramı çalıştırıp izlemek hatayı bulmanın en iyi yoludur.","Bazen komutlar doğrudur ama sırası yanlıştır."],teacher:"<b>Bozuk tarif oyunu:</b> Tahtaya kasıtlı hatalı bir algoritma yazın (ör. “Çorabı giy, ayakkabıyı giy, ayakkabıyı bağla, çorabı çıkar”). Öğrenciler hatayı bulsun ve düzeltilmiş halini söylesin. Hata yapmanın programcılığın doğal bir parçası olduğunu vurgulayın.",steps:[{type:"story",anim:"think",title:"Programda böcek var! 🐞",text:"<p>Bazen yazdığımız program istediğimiz gibi çalışmaz. Programdaki hataya <b>bug</b> yani <b>böcek</b> denir.</p><p>Çok eskiden bir bilgisayarın içine gerçek bir güve girmiş ve bilgisayarı bozmuş. O günden beri hatalara “bug” deniyor!</p>",pics:["🖥️","🦋","🐞","🔍"]},{type:"story",anim:"wave",title:"Bug avcısı ipuçları 🔍",text:`<ol class="tips"><li><b>▶ Çalıştır</b> ve Robo'yu dikkatle izle. Hangi blok çalışırken parlıyor?</li><li>Robo <b>nerede</b> yanlış yere gitti?</li><li>O bloğun <b>✖</b> düğmesine basıp sil. Kırmızı çizgi silinen yerde kalır.</li><li>Doğru komuta tıkla, tam o yere eklenir.</li></ol><p class="mut">Bir bloğa tıklarsan kırmızı çizgi onun altına geçer. Blokları sürükleyerek yerlerini de değiştirebilirsin.</p>`},{type:"grid",title:"Eksik adım",text:"<p>Robo pile ulaşamıyor! Önce <b>▶ Çalıştır</b>'a basıp izle. Programda bir şey <b>eksik</b>.</p>",map:["S....G"],dir:"E",tools:["F"],preset:"FFF",sol:"FFFFF",hint:"Pile kadar 5 kare var ama programda sadece 3 İleri git var."},{type:"grid",title:"Yanlış dönüş",text:"<p>Bu programda <b>bir komut yanlış</b>. Robo köşede yanlış yöne dönüyor! Yanlış bloğu ✖ ile sil, yerine doğrusunu koy.</p>",map:["S..","##.","##G"],dir:"E",tools:["F","L","R"],preset:"FFLFF",sol:"FFRFF",hint:"↰ Sola dön bloğunu sil ve aynı yere ↱ Sağa dön ekle."},{type:"quiz",title:"Hangi blok hatalı?",pic:he(["S..","##.","##G"])+ke("FFLFF"),q:"Bu programda hangi blok hatalı?",opts:["1. blok (İleri git)","3. blok (Sola dön)","5. blok (İleri git)"],a:1,ok:"Köşede Robo'nun aşağı inmesi için sağa dönmesi gerek."},{type:"grid",title:"Neden suya düştü?",text:"<p>Robo suya düşüyor! 💦 Hangi adım eksik? Robo'nun nerede döndüğüne dikkat et.</p>",map:["..*..",".~~~.","S~~~G"],dir:"N",tools:["F","L","R"],preset:"FFRFFFRFF",sol:"FFRFFFFRFF",hint:"Üst sırada 4 kare gitmesi lazım ama 3 kare gidip dönüyor. İkinci ↱ Sağa dön bloğunun önüne bir İleri git ekle."},{type:"grid",title:"Fazladan bir blok",text:"<p>Bu sefer programda <b>fazladan</b> bir komut var. Robo yolun dışına çıkıyor. Hangisini silmeliyiz?</p>",map:["#...G","#.###","S*..."],dir:"E",tools:["F","L","R"],preset:"FLFFFRFFF",sol:"FLFFRFFF",hint:"Robo yukarı çıkarken 2 kare gitmeli, programda 3 tane var."},{type:"grid",title:"Sıra karışmış!",text:"<p>Bu programdaki komutların hepsi doğru ama <b>sırası</b> yanlış! Robo anahtarı almadan kapıya gidiyor. Blokları <b>sürükleyerek</b> sırayı düzelt.</p>",map:["k.S.DG"],dir:"E",tools:["F","B"],preset:"FFFFFBB",sol:"BBFFFFF",hint:"İki Geri git bloğunu sürükleyip programın en başına bırak."},{type:"grid",title:"İki bug birden",text:"<p>Dikkat! Bu programda <b>iki</b> hata var. Birini düzeltince tekrar çalıştır; Robo sana ikincisini gösterecek.</p>",map:["S.~~","#.*#","##.G"],dir:"E",tools:["F","L","R"],preset:"FRFLFLFLFF",sol:"FRFLFRFLF",hint:"Yıldızdan sonra Robo aşağı inmeli (sağa dön). Bir de en sonda fazladan bir İleri git var."},{type:"grid",title:"⭐ Bonus: Büyük bug avı",text:"<p>Uzun bir program, iki hata. Robo'yu dikkatle izle; nerede yoldan çıktığını bul.</p>",map:["S.#*..","#.#.#.","#...#G"],dir:"E",tools:["F","L","R"],preset:"FRFFLFFRFFRFFRF",sol:"FRFFLFFLFFRFFRFF",hint:"Alttaki yoldan sonra Robo yukarı (sola) dönmeli. Programın sonunda da bir İleri git eksik."}]},Na={icon:"🔁",color:"#8a5cff",title:"Tekrar Tekrar: Döngüler",concept:"Döngü (tekrar)",desc:"Aynı komutları tekrar tekrar yazmak yerine “Tekrarla” bloğu ile kısa programlar yaz.",learned:["Döngü, bazı komutları belli sayıda tekrar ettirir.","Döngüler programı kısaltır ve okumayı kolaylaştırır.","Tekrar eden bir deseni bulmak, döngü kurmanın ilk adımıdır."],teacher:"<b>Dans döngüsü:</b> Sınıfla bir dans hareketi kurun: “alkışla, zıpla, dön”. Tahtaya “3 kez tekrarla: alkışla, zıpla, dön” yazın ve hep birlikte yapın. Sonra öğrenciler kendi dans döngülerini yazsın. Scratch'teki “tekrarla” bloğu tam olarak budur.",steps:[{type:"story",anim:"think",title:"Ufff, çok yoruldum! 😮‍💨",text:'<p>“İleri git, ileri git, ileri git, ileri git, ileri git, ileri git…” demek çok yorucu değil mi?</p><p>Bunun yerine <span class="chipb c-loop">🔁 6 kez tekrarla: ⬆ İleri git</span> diyebiliriz. Buna <b>DÖNGÜ</b> denir!</p>',pics:["⬆","⬆","⬆","⬆","⬆","⬆","=","🔁"]},{type:"story",anim:"dance",title:"Tekrarla bloğu nasıl kullanılır?",text:'<ol class="tips"><li><b>🔁 Tekrarla</b> düğmesine bas. Programına bir döngü eklenir.</li><li>Kırmızı çizgi döngünün <b>içine</b> geçer. Tekrar edilecek komutlara tıkla.</li><li>Sayıyı değiştirerek kaç kez tekrarlanacağını seç.</li><li>Döngüden sonra komut eklemek için <b>“döngü sonu”</b> yazısına tıkla.</li><li>Bir blok döngünün dışında mı kaldı? Onu <b>sürükleyip</b> döngünün içine bırak. ✋</li></ol>'},{type:"quiz",title:"Kaç kare gider?",q:`<span class="chipb c-loop">🔁 3 kez tekrarla: ⬆ İleri git</span> programı Robo'yu kaç kare ilerletir?`,opts:["1 kare","3 kare","4 kare"],a:1,ok:"İçindeki İleri git komutu 3 kez çalışır, Robo 3 kare gider."},{type:"grid",title:"Uzun koridor",text:"<p>Pil çok uzakta! Ama bu görevde en fazla <b>2 blok</b> kullanabilirsin. Döngü ile çöz!</p>",map:["S.......G"],dir:"E",tools:["F","loop"],max:2,loopN:2,sol:"8(F)",hint:"🔁 Tekrarla ekle, içine bir ⬆ İleri git koy. Sonra sayıyı 8 yap."},{type:"quiz",title:"Robo ne çizer?",q:'<span class="chipb c-loop">🔁 4 kez tekrarla: ⬆ İleri git, ↱ Sağa dön</span> programında Robo nasıl bir yol çizer?',opts:["Düz bir çizgi","Bir kare ⬜ çizip başladığı yere döner","Zikzak"],a:1,ok:"Her turda bir kenar çizip sağa döner. 4 kenar = bir kare!"},{type:"grid",title:"Merdiven döngüsü",text:"<p>Merdivenin her basamağı aynı! Tekrar eden <b>deseni</b> bul, döngünün içine koy. En fazla <b>5 blok</b>.</p>",map:["###G","##.*","#.*#","S.##"],dir:"E",tools:["F","L","R","loop"],max:5,sol:"3(FLFR)",hint:"Bir basamak: İleri git, Sola dön, İleri git, Sağa dön. Bu 4 komutu 3 kez tekrarla."},{type:"grid",title:"Döngüden sonra",text:"<p>Önce döngüyle uzun yolu git, sonra <b>döngü sonu</b> yazısına tıklayıp döngünün <b>dışına</b> komut ekle.</p>",map:["S....#","####.#","####G#"],dir:"E",tools:["F","L","R","loop"],max:6,sol:"4(F)R2(F)",hint:"4 kez tekrarla: İleri git. Döngüden sonra: Sağa dön, 2 kez İleri git."},{type:"grid",title:"Yıldızlı zikzak",text:"<p>Aşağı doğru zikzak bir yol. Deseni bul! En fazla <b>5 blok</b>.</p>",map:["S.##","#*.#","##*.","###G"],dir:"E",tools:["F","L","R","loop"],max:5,sol:"3(FRFL)",hint:"Bir parça: İleri git, Sağa dön, İleri git, Sola dön."},{type:"quiz",title:"Hangisi daha iyi?",pic:ke("FFFFFF")+ke("6(F)"),q:"Bu iki program Robo'yu aynı yere götürür. Hangisi daha iyi?",opts:["Soldaki, çünkü daha uzun","Sağdaki, çünkü daha kısa ve okuması kolay","İkisi de çalışmaz"],a:1,ok:"Döngülü program 2 blok, diğeri 6 blok. Kısa programı okumak ve düzeltmek daha kolaydır."},{type:"grid",title:"Büyük merdiven",text:"<p>Beş basamaklı dev merdiven! Döngünün sayısını doğru seç. En fazla <b>5 blok</b>.</p>",map:["#####G","####..","###..#","##..##","#..###","S.####"],dir:"E",tools:["F","L","R","loop"],max:5,loopN:2,sol:"5(FLFR)"},{type:"grid",title:"Bahçeyi dolaş",text:"<p>Bahçenin köşelerindeki yıldızları topla ve pile git. Döngüden sonra bir blok daha gerekebilir. En fazla <b>5 blok</b>.</p>",map:["S.*","G#.","*.*"],dir:"E",tools:["F","L","R","loop"],max:5,sol:"3(FFR)F",hint:"Her kenarda: 2 kez İleri git, Sağa dön. Bunu 3 kez tekrarla, sonra döngü sonuna tıklayıp bir İleri git daha ekle."},{type:"grid",title:"⭐ Bonus: Merdiven ve koridor",text:"<p>Önce merdiven, sonra koridor! İki ayrı döngü kullanabilirsin. En fazla <b>7 blok</b>.</p>",map:["###.*.G","##..###","#..####","S.#####"],dir:"E",tools:["F","L","R","loop"],max:7,sol:"3(FLFR)3(F)",hint:"Birinci döngü: 3 kez (İleri, Sola dön, İleri, Sağa dön). İkinci döngü: 3 kez İleri git."}]},Ya={icon:"🧶",color:"#d946ef",title:"Desenler ve İç İçe Döngüler",concept:"Desen bulma",desc:"Tekrar eden desenleri bul, döngünün içine döngü koy ve yıldızları tek tek topla.",learned:["Desen, belli bir düzenle tekrar eden şeydir.","Bir döngünün içine başka bir döngü koyabiliriz (iç içe döngü).","“Yıldızı al” komutu ile Robo yıldızları kendisi toplar."],teacher:"<b>Ritim deseni:</b> Sınıfla bir ritim yapın: “alkış, alkış, masaya vur”. Bunu 4 kez tekrarlayın. Sonra sorun: “Bu ritmin içinde başka bir tekrar var mı?” (alkış 2 kez). Bu, iç içe döngüdür: 4 kez tekrarla [2 kez alkışla, masaya vur].",steps:[{type:"story",anim:"think",title:"Desen dedektifi 🔍",text:"<p>Etrafına bak: kaldırım taşları, kazağındaki çizgiler, bir şarkının nakaratı… Hepsinde <b>tekrar eden bir düzen</b> var. Buna <b>desen</b> denir.</p><p>Deseni bulursan döngü kurmak çok kolaylaşır!</p>",pics:["🟥","🟦","🟥","🟦","🟥","❓"]},{type:"quiz",title:"Sırada ne var?",q:"🍎 🍌 🍌 🍎 🍌 🍌 🍎 🍌 … Sıradaki ne?",opts:["🍎","🍌","🍇"],a:1,ok:"Desen: 1 elma, 2 muz. Son elmadan sonra bir muz geldi, şimdi bir muz daha!"},{type:"quiz",title:"Tekrar eden parça",q:`${fe("FFR")} &nbsp; ${fe("FFR")} &nbsp; ${fe("FFR")}<br>Bu programda tekrar eden parça hangisi?`,opts:[fe("FF"),fe("FFR"),fe("RF")],a:1,ok:"İleri, ileri, sağa dön: 3 kez tekrar ediyor. Yani 🔁 3 kez tekrarla [⬆ ⬆ ↱]"},{type:"story",anim:"dance",title:"Döngünün içinde döngü!",text:'<p>Bir döngünün içine <b>başka bir döngü</b> koyabiliriz. Buna <b>iç içe döngü</b> denir.</p><p><span class="chipb c-loop">🔁 3 kez tekrarla</span> içinde <span class="chipb c-loop">🔁 2 kez tekrarla: ⬆</span> ve <span class="chipb c-r">↱</span></p><p>Dıştaki döngünün her turunda içteki döngü baştan sona çalışır.</p>'},{type:"quiz",title:"Kaç kez ileri?",pic:ke("2(3(F)R)"),q:"Bu programda Robo toplam kaç kez <b>İleri git</b> yapar?",opts:["3","5","6"],a:2,ok:"İçteki döngü 3 kez ileri gider. Dıştaki döngü bunu 2 kez yapar: 2 × 3 = 6."},{type:"grid",title:"Büyük kare",text:"<p>Gölün etrafında büyük bir kare! Her kenar aynı: 4 kez ileri, sağa dön. İç içe döngü kullan. En fazla <b>6 blok</b>.</p>",map:["S...*","G~~~.",".~~~.",".~~~.","*...*"],dir:"E",tools:["F","L","R","loop"],max:6,loopN:4,sol:"3(4(F)R)3(F)",hint:"Dış döngü 3 kez: [içte 4 kez İleri git, sonra Sağa dön]. Sonra döngü sonunda 3 kez İleri git (bunu da döngüyle yapabilirsin)."},{type:"story",anim:"wave",title:"Yeni komut: Yıldızı al ✋",text:'<p>Bu görevlerde yıldızlar kendiliğinden toplanmıyor! Yıldızın <b>tam üstündeyken</b> <span class="chipb c-p">✋ Yıldızı al</span> demelisin.</p><p>Yıldız olmayan bir yerde “al” dersen eli boş kalırım. 🤷</p>'},{type:"grid",title:"Her iki adımda bir",text:"<p>Yıldızlar iki karede bir. Deseni bul: 2 kez ileri, yıldızı al. En fazla <b>6 blok</b>.</p>",map:["S.*.*.*G"],dir:"E",tools:["F","P","loop"],pick:!0,max:6,loopN:3,sol:"3(2(F)P)F",hint:"3 kez tekrarla [2 kez İleri git, Yıldızı al]. Döngüden sonra bir İleri git."},{type:"grid",title:"Köşe yıldızları",text:"<p>Bahçenin köşelerindeki yıldızları <b>tek tek al</b> ve pile git. En fazla <b>6 blok</b>.</p>",map:["S.*","G#.","*.*"],dir:"E",tools:["F","R","P","loop"],pick:!0,max:6,sol:"3(2(F)PR)F",hint:"Her kenarda: 2 kez İleri git, Yıldızı al, Sağa dön. 3 kez tekrarla, sonra bir İleri git."},{type:"grid",title:"⭐ Bonus: Kenar ortaları",text:"<p>Yıldızlar bu sefer kenarların <b>ortasında</b>. Bir kenarın deseni ne? En fazla <b>9 blok</b>.</p>",map:["S.*..",".~~~.","G~~~*",".~~~.","..*.."],dir:"E",tools:["F","R","P","loop"],pick:!0,max:9,loopN:2,sol:"3(2(F)P2(F)R)2(F)",hint:"Bir kenar: 2 ileri, al, 2 ileri, sağa dön. Bunu 3 kez yap, sonra 2 kez ileri."}]},ja={icon:"🏰",color:"#f59e0b",title:"Labirent Görevi",concept:"Hepsini birleştir",desc:"Seviye sonu! Döngüleri, anahtarları ve yıldızları kullanarak zorlu labirentleri geç.",learned:["Öğrendiğimiz her şeyi (sıra, yön, döngü, hata ayıklama) birlikte kullanabiliriz.","Büyük bir problemi küçük parçalara bölmek işi kolaylaştırır.","Kısa program her zaman en iyi programdır, ama önce çalışan bir program yazmak önemlidir."],teacher:"<b>Labirent yarışması:</b> Öğrenciler ikili gruplar halinde kareli kâğıda kendi labirentlerini çizsin (en az bir kapı ve anahtar). Gruplar labirentleri değiştirsin ve birbirlerinin labirenti için ok işaretleriyle program yazsın. En kısa çalışan programı yazan grup kazanır.",steps:[{type:"story",anim:"dance",title:"Seviye sonu! 🏰",text:"<p>Tebrikler, buraya kadar geldin! Şimdi öğrendiğin her şeyi kullanma zamanı: <b>sıralama, ileri-geri, dönüşler, anahtarlar, döngüler</b>.</p><p>Her labirentte önce <b>plan yap</b>, sonra programı yaz, çalışmazsa <b>bug avla</b>!</p>",pics:["🗺️","🔑","🔁","🐞","🏆"]},{type:"grid",title:"Isınma turu",text:"<p>Suyun yanından dikkatlice geç.</p>",map:["S.~..","#.~.#","#...G"],dir:"E",tools:["F","L","R","loop"],sol:"FRFFL3(F)"},{type:"grid",title:"Kale kapısı",text:"<p>Kalenin anahtarı en dipte! Anahtarı al, kapıyı aç, pile ulaş.</p>",map:["S..#k","##.#.","G#...",".#D##","...##"],dir:"E",tools:["F","B","L","R","loop"],sol:"2(F)R2(F)L2(F)L2(F)2(B)L2(F)L2(F)R2(F)R2(F)",hint:"Yolu parçalara böl: önce anahtara git. Sonra geri gel ve kapıya doğru in. Kapıdan sonra sola, sonra yukarı."},{type:"quiz",title:"Hangi program daha kısa?",pic:he(["S....","####.","####G"]),q:"İki program da Robo'yu pile götürüyor. Hangisi daha kısa?",opts:[fe("FFFFRFF"),`<span class="chipb c-loop">🔁 4 × ⬆</span> ${fe("R")} <span class="chipb c-loop">🔁 2 × ⬆</span>`],a:1,ok:"Döngülü program 6 blok, diğeri 7 blok. Yolun uzun olduğu yerlerde döngü hep kazandırır."},{type:"grid",title:"Yıldız tarlası",text:"<p>İki sıra yıldız var. Her yıldızı <b>al</b>, sonra pile git. En fazla <b>12 blok</b>.</p>",map:["S*.*.","G*.*."],dir:"E",tools:["F","L","R","P","loop"],pick:!0,max:12,sol:"2(FPF)RFR2(FPF)",hint:"Üst sıra: 2 kez [İleri, Al, İleri]. Sağa dön, İleri, Sağa dön. Alt sıra: yine 2 kez [İleri, Al, İleri]."},{type:"grid",title:"Spiral",text:"<p>Robo bir sarmalın içine giriyor! Her köşede aynı yöne dönüyor. En fazla <b>14 blok</b>.</p>",map:["S....","####.","..G#.",".###.","....."],dir:"E",tools:["F","L","R","loop"],max:14,sol:"4(F)R4(F)R4(F)R2(F)R2(F)",hint:"Kenar uzunlukları: 4, 4, 4, 2, 2. Her kenardan sonra sağa dön."},{type:"grid",title:"Çifte kapı",text:"<p>İki kapı, bir anahtar! Anahtarı alınca bütün kapılar açılır.</p>",map:["G.D..","###.#","k.S.#","###D#","###.*"],dir:"E",tools:["F","B","L","R","loop"],sol:"2(B)3(F)R2(F)LFBL4(F)L3(F)",hint:"Önce anahtar (2 geri). Sonra sağa git, aşağı in ve yıldızı al. Geri dön, yukarı çık ve en üstten sola git."},{type:"grid",title:"⭐ Bonus: Usta işi",text:"<p>Son labirent! En az blokla çözmeye çalış. ⭐⭐⭐ alabilecek misin?</p>",map:["S.*.*.*","######.","*.*.*.*",".######","G......"],dir:"E",tools:["F","L","R","P","loop"],pick:!0,sol:"3(2(F)P)R2(F)R3(P2(F))PL2(F)",hint:"Üst sıra: 3 kez [2 ileri, al]. Aşağı in. Orta sıra: 3 kez [al, 2 ileri], sonra al. En sonda aşağı in."}]}});var Qa,er,Za,Va,Ua,Ia,Wa=le(()=>{We();Qa=["###G","##.*","#.*#","S.##"],er=["S...*","G~~~.",".~~~.",".~~~.","*...*"],Za={icon:"🧩",color:"#ff6680",title:"Kendi Bloğunu Yap",concept:"Fonksiyon",desc:"Sık yaptığın hareketlere bir ad ver ve tek blokla çağır: fonksiyon!",learned:["Fonksiyon, bir grup komuta verdiğimiz addır.","Fonksiyonu bir kez yazar, istediğimiz kadar çağırırız.","Fonksiyondaki bir hatayı düzeltince, onu kullanan her yer düzelir."],teacher:"<b>Komut sözlüğü:</b> Sınıfla “selam” adlı bir hareket uydurun: el salla + eğil + zıpla. Artık öğretmen sadece “selam!” dediğinde herkes üç hareketi birden yapar. Sonra “3 kez selam” deyin. Scratch'te bunun adı “Blok Tanımla”dır (pembe bloklar).",steps:[{type:"story",anim:"think",title:"Hep aynı hareketler…",text:'<p>Merdiven çıkarken hep aynı şeyi yapıyorum: <b>ileri, sola dön, ileri, sağa dön</b>. Bunu her seferinde yazmak zorunda mıyız?</p><p>Hayır! Bu dört komuta bir <b>ad</b> verelim: <span class="chipb c-fn">🧩 Basamak</span>. Artık “Basamak” dediğinde dört komutu birden yaparım. Buna <b>FONKSİYON</b> denir.</p>',pics:["⬆","↰","⬆","↱","=","🧩"]},{type:"story",anim:"wave",title:"Fonksiyon nasıl yazılır?",text:'<ol class="tips"><li>Sağdaki pembe <b>“fonksiyonum”</b> kutusuna tıkla ve fonksiyonun adımlarını oraya yaz.</li><li>Sonra <b>Programım</b> kutusuna tıkla ve <span class="chipb c-fn">🧩</span> fonksiyon bloğunu ekle.</li><li>Program çalışırken fonksiyon bloğuna gelince, Robo pembe kutudaki adımları yapar.</li></ol>'},{type:"quiz",title:"Kaç kez döner?",pic:ke("fff","FR","Köşe"),q:"Robo bu programda toplam kaç kez <b>sağa döner</b>?",opts:["1","2","3"],a:2,ok:"“Köşe” fonksiyonunda bir sağa dönüş var ve fonksiyon 3 kez çağrılıyor."},{type:"grid",title:"Basamak fonksiyonu",text:"<p>Önce pembe kutuya <b>Basamak</b> fonksiyonunu yaz: ileri, sola dön, ileri, sağa dön. Sonra programına 3 kez Basamak ekle.</p>",map:Qa,dir:"E",tools:["F","L","R","fn"],fnName:"Basamak",max:7,sol:"fff",fnSol:"FLFR",hint:"Pembe kutu: ⬆ ↰ ⬆ ↱. Programım: 🧩 🧩 🧩"},{type:"grid",title:"Hazır fonksiyon",text:"<p><b>Kenar</b> fonksiyonu hazır: 2 kez ileri, sağa dön. Sen sadece programı yaz!</p>",map:["S.*","G#.","*.*"],dir:"E",tools:["F","R","fn"],fnName:"Kenar",fnPreset:"FFR",sol:"fffF",hint:"3 kez Kenar, sonra bir İleri git."},{type:"grid",title:"Bozuk fonksiyon",text:"<p>Program doğru ama <b>Basamak</b> fonksiyonunda bir bug var! Fonksiyonu düzelt; bütün basamaklar birden düzelecek.</p>",map:Qa,dir:"E",tools:["F","L","R","fn"],fnName:"Basamak",preset:"fff",fnPreset:"FRFL",sol:"fff",fnSol:"FLFR",hint:"Fonksiyonda dönüşler ters: önce sola, sonra sağa dönmeli."},{type:"grid",title:"Fonksiyon + döngü",text:"<p><b>Kenar</b> fonksiyonunu kendin yaz: 4 kez ileri, sağa dön (fonksiyonun içinde döngü olabilir!). Sonra programda Kenar'ı döngüyle çağır. En fazla <b>7 blok</b>.</p>",map:er,dir:"E",tools:["F","R","loop","fn"],fnName:"Kenar",max:7,loopN:4,sol:"3(f)3(F)",fnSol:"4(F)R",hint:"Kenar = 🔁 4 × ⬆, ↱. Programım = 🔁 3 × Kenar, sonra 🔁 3 × ⬆."},{type:"grid",title:"Topla fonksiyonu",text:"<p><b>Topla</b> fonksiyonu yaz: ileri git, yıldızı al, ileri git. Sonra iki sıradaki bütün yıldızları topla.</p>",map:["S*.*.","G*.*."],dir:"E",tools:["F","R","P","fn"],fnName:"Topla",pick:!0,sol:"ffRFRff",fnSol:"FPF",hint:"Topla = ⬆ ✋ ⬆. Programım: Topla, Topla, ↱, ⬆, ↱, Topla, Topla."},{type:"quiz",title:"Neden fonksiyon?",q:"Fonksiyon kullanmanın en büyük faydası nedir?",opts:["Robo daha hızlı koşar","Aynı adımları tekrar tekrar yazmayız; program kısalır ve düzeltmesi kolaylaşır","Pil daha çok dolar"],a:1,ok:"Bir kez yaz, istediğin kadar kullan! Hata varsa tek bir yerde düzeltirsin."},{type:"grid",title:"⭐ Bonus: Dev merdiven",text:"<p>Beş basamak! Basamak fonksiyonu ve bir döngü ile en kısa programı yaz. En fazla <b>6 blok</b>.</p>",map:["#####G","####..","###..#","##..##","#..###","S.####"],dir:"E",tools:["F","L","R","loop","fn"],fnName:"Basamak",max:6,loopN:5,sol:"5(f)",fnSol:"FLFR"}]},Va={icon:"❓",color:"#f08c00",title:"Eğer… ise",concept:"Koşul",desc:"Robo artık etrafını görebiliyor! “Eğer” bloğu ile duruma göre karar ver.",learned:["Koşul, cevabı “evet” ya da “hayır” olan bir sorudur.","“Eğer … ise” bloğunun içindekiler sadece koşul doğruysa çalışır.","Koşullar sayesinde aynı program farklı haritalarda çalışabilir."],teacher:"<b>Eğer oyunu:</b> “Eğer gözlüğün varsa ayağa kalk.” “Eğer adında A harfi varsa el çırp.” Öğrenciler sadece koşul kendilerine uyuyorsa hareket eder. Sonra öğrenciler kendi “eğer” cümlelerini kursun. Bu Scratch'teki turuncu “eğer” bloğudur.",steps:[{type:"story",anim:"wave",title:"Robo'nun gözleri var! 👀",text:"<p>Artık <b>sensörlerim</b> var. Önümde engel var mı, yıldızın üstünde miyim, pile ulaştım mı… görebiliyorum!</p><p>Sen de her gün karar verirsin: <b>Eğer</b> yağmur yağıyorsa şemsiye alırsın ☔. Yağmıyorsa almazsın.</p>",pics:["🌧️","➡️","☔","☀️","➡️","🚫☔"]},{type:"quiz",title:"Günlük hayatta eğer",q:"<b>Eğer</b> trafik ışığı kırmızıysa ne yaparız?",opts:["Koşarak geçeriz","Dururuz","Zıplarız"],a:1,ok:"Koşul: “ışık kırmızı mı?” Cevap evet ise dururuz."},{type:"story",anim:"think",title:"Haritayı bilmiyorsak?",text:'<p>Bu bölümde her görevde <b>birkaç harita</b> var. Senin programın <b>hepsinde</b> çalışmalı!</p><p>Yıldızların yeri haritadan haritaya değişiyor. Bu yüzden şöyle demeliyiz: <span class="chipb c-if">❓ eğer yıldızın üstündeyim ise: ✋ Yıldızı al</span></p><p class="mut">Haritaların üstündeki sekmelere tıklayarak hepsine bakabilirsin. ▶ Çalıştır hepsini sırayla dener.</p>'},{type:"grid",title:"Yıldız varsa al",text:"<p>Her karede <b>eğer yıldız varsa</b> al. Aynı program 3 haritada da çalışmalı! En fazla <b>4 blok</b>.</p>",maps:[["S*.*..G"],["S..**.G"],["S.*..*G"]],dir:"E",tools:["F","P","loop","if"],conds:["star","open","blocked"],pick:!0,max:4,loopN:6,sol:"6(Fi{star}(P))",hint:"6 kez tekrarla [İleri git, eğer yıldızın üstündeyim ise: Yıldızı al]."},{type:"quiz",title:"Kaç yıldız alır?",pic:he(["S*.*"])+ke("3(Fi{star}(P))"),q:"Robo bu programla kaç yıldız alır?",opts:["1","2","3"],a:1,ok:"Her adımdan sonra bakıyor: 1. ve 3. karede yıldız var, 2. karede yok."},{type:"grid",title:"Engel varsa dön",text:"<p>Yol bir yerde sağa dönüyor ama nerede döndüğü haritadan haritaya değişiyor. <b>Eğer önünde engel varsa</b> sağa dön, sonra ileri git. En fazla <b>4 blok</b>.</p>",maps:[["S..","##.","##.","##G"],["S.","#.","#.","#.","#G"],["S....","####G"]],dir:"E",tools:["F","R","loop","if"],conds:["blocked","open","star"],max:4,loopN:5,sol:"5(i{blocked}(R)F)",hint:"5 kez tekrarla [eğer önümde engel var ise: Sağa dön; İleri git]."},{type:"grid",title:"Halka bahçe",text:"<p>Yıldızlar her haritada farklı köşelerde. İç içe döngü ve “eğer” kullan. En fazla <b>8 blok</b>.</p>",maps:[["S.*","G#.","*.."],["S..","G#*","..*"],["S*.","G#.",".*."]],dir:"E",tools:["F","R","P","loop","if"],conds:["star","open","blocked"],pick:!0,max:8,loopN:3,sol:"3(2(Fi{star}(P))R)F", ürüsün",f:e=>e.sp("Kedi").x>=-20},{t:"Kedi iki farklı şey söylesin",f:e=>new Set(e.w.log.said.map(a=>a.text)).size>=2}],hint:"🏁 tıklandığında → Merhaba! de 2 saniye → 100 adım git → “Ben Scratch kedisiyim!” de 2 saniye",sol:{Kedi:[[["flag"],["sayFor","Merhaba!",1],["move",100],["sayFor","Ben Scratch kedisiyim!",1]]]}},{type:"quiz",title:"Bloklar hangi sırayla çalışır?",q:"Bir betikteki bloklar hangi sırayla çalışır?",opts:["Aşağıdan yukarıya","Yukarıdan aşağıya, sırayla","Hepsi rastgele"],a:1,ok:"Tıpkı Robo'nun programı gibi: en üstten başlar, sırayla aşağı iner."},{type:"scratch",title:"Dans eden kedi",text:`<p>Kedi bir sağa, bir sola dönsün! ${P("motion","↻ 15 derece dön")} sağa, ${P("motion","↺ 15 derece dön")} sola döndürür. Arada ${P("control","1 saniye bekle")} kullan ki dansı görebilelim.</p>`,setup:{backdrop:"sahne",sprites:[G("Kedi","kedi",0,-60,{rot:"all"})]},blocks:["flag","turnR","turnL","wait"],goals:[{t:"Kedi sağa dönsün ↻",f:e=>e.sp("Kedi").dir>90},{t:"Kedi sola dönsün ↺",f:e=>e.sp("Kedi").dir<90},{t:"“bekle” bloğunu kullan",use:"wait"}],sol:{Kedi:[[["flag"],["turnR",30],["wait",.5],["turnL",60],["wait",.5],["turnR",30]]]}},{type:"scratch",title:"Tam bir tur!",text:`<p>Robo'dan hatırlıyor musun? ${P("control","10 kez tekrarla")} bloğu içindekileri tekrar eder. Kedi tekrarla bloğu ile <b>tam bir tur</b> (360 derece) dönsün.</p><p class="mut">İpucu: 10 kez × 36 derece = 360 derece</p>`,setup:{backdrop:"sahne",sprites:[G("Kedi","kedi",0,-60,{rot:"all"})]},blocks:["flag","repeat","turnR","turnL","wait"],goals:[{t:"“tekrarla” bloğunu kullan",use:"repeat"},{t:"Kedi tam bir tur dönsün (360°)",f:e=>e.sp("Kedi").turned>=360}],hint:"🏁 tıklandığında → 10 kez tekrarla [↻ 36 derece dön, 0.1 saniye bekle]",sol:{Kedi:[[["flag"],["repeat",10,[["turnR",36],["wait",.1]]]]]}},{type:"scratch",title:"⭐ Kendi gösterini yap",text:"<p>Sahne senin! Kedi yürüsün, dönsün, konuşsun… İstediğin gibi bir gösteri hazırla. Hazır olunca <b>✔ Bitirdim</b> düğmesine bas.</p>",setup:{backdrop:"sahne",sprites:[G("Kedi","kedi",-100,-60,{rot:"all"})]},blocks:["flag","move","turnR","turnL","sayFor","wait","repeat"],free:!0,goals:[{t:"🏁 ile başlayan bir betik yaz",use:"flag"},{t:"“tekrarla” kullan",use:"repeat"},{t:"Kedi bir şey söylesin",use:"sayFor"}],sol:{Kedi:[[["flag"],["sayFor","İzleyin!",1],["repeat",4,[["move",50],["turnR",90]]]]]}}]},ct={icon:"🧭",color:"#2f6fd6",title:"Hareket ve Koordinatlar",concept:"x ve y",desc:"Sahne bir harita: x sağ-sol, y yukarı-aşağı. Kuklaları istediğin noktaya ışınla, süzdür ve yönlendir.",learned:["Sahnenin ortası x: 0, y: 0 noktasıdır.","x sağa doğru büyür, sola doğru küçülür; y yukarı doğru büyür, aşağı doğru küçülür.","Yön 0 yukarı, 90 sağ, 180 aşağı, -90 soldur."],teacher:"<b>Sınıf koordinat oyunu:</b> Yere bantla iki çizgi yapıştırın (x ve y ekseni). Öğrencilere “x: 2, y: -1” gibi koordinatlar söyleyin, o noktaya gitsinler. Sonra öğrenciler birbirine koordinat sorsun. Satranç tahtasındaki “e4” gibi adlandırmalarla bağ kurabilirsiniz.",steps:[{type:"story",anim:"think",title:"Sahne bir harita gibidir 🗺️",text:`<p>Sahnedeki her noktanın bir adresi var: <b>x</b> ve <b>y</b>.</p><p><b>x</b> sağ-sol konumu: sağa gittikçe büyür (240'a kadar), sola gittikçe küçülür (-240'a kadar).<br><b>y</b> yukarı-aşağı konumu: yukarı gittikçe büyür (180), aşağı gittikçe küçülür (-180).</p><p>Tam orta: <b>x: 0, y: 0</b></p>${ya("koordinat",280)}`},{type:"quiz",title:"Orta nokta",q:"<b>x: 0, y: 0</b> sahnenin neresidir?",opts:["Sol üst köşe","Tam ortası","Sağ alt köşe"],a:1,ok:"Sahnenin tam ortası! Oradan sağa x büyür, yukarı y büyür."},{type:"quiz",title:"Köşeyi bul",pic:ya("koordinat",220),q:"Hangi nokta <b>sağ üst köşeye</b> en yakındır?",opts:["x: 200, y: 150","x: -200, y: 150","x: 200, y: -150"],a:0,ok:"Sağ için x artı (+), yukarı için y artı (+) olmalı."},{type:"scratch",title:"Yıldıza ışınlan",text:`<p>${P("motion","x: 0 y: 0 konumuna git")} bloğu kuklayı bir anda o noktaya ışınlar. Yıldızın koordinatını bul ve kediyi oraya gönder!</p><p class="mut">İpucu: Fareyi sahnede yıldızın üstüne getir; sahnenin üstünde farenin x ve y değerleri yazar.</p>`,setup:{backdrop:"koordinat",sprites:[G("Kedi","kedi",0,0,{size:70}),G("Yıldız","yildiz",150,100)]},blocks:["flag","goto","move"],goals:[{t:"“konumuna git” bloğunu kullan",use:"goto"},{t:"Kedi yıldıza dokunsun",f:e=>e.touching("Kedi","Yıldız")}],sol:{Kedi:[[["flag"],["goto",150,100]]]}},{type:"scratch",title:"Dört köşedeki çiçekler",text:`<p>Arı dört çiçeği de ziyaret etmeli! ${P("motion","1 saniyede x: 0 y: 0 konumuna süzül")} bloğu kuklayı yavaşça kaydırır. Her çiçeğin koordinatını bul.</p>`,setup:{backdrop:"koordinat",sprites:[G("Çiçek1","cicek",-170,110),G("Çiçek2","cicek",170,110),G("Çiçek3","cicek",170,-110),G("Çiçek4","cicek",-170,-110),G("Arı","ari",0,0)]},blocks:["flag","glide","goto","wait"],goals:[1,2,3,4].map(e=>({t:`${e}. çiçeğe uğra 🌸`,f:a=>a.touching("Arı","Çiçek"+e)})),hint:"Çiçekler: sol üst (-170, 110), sağ üst (170, 110), sağ alt (170, -110), sol alt (-170, -110).",sol:{Arı:[[["flag"],["glide",1,-170,110],["glide",1,170,110],["glide",1,170,-110],["glide",1,-170,-110]]]}},{type:"quiz",title:"x değişirse",q:`${P("motion","x'i 10 değiştir")} bloğu kuklayı nasıl hareket ettirir?`,opts:["10 adım sağa kaydırır","10 adım yukarı kaydırır","Kuklayı 10 derece döndürür"],a:0,ok:"x sağ-sol demek. +10 sağa, -10 sola kaydırır. Yukarı-aşağı için y kullanılır."},{type:"scratch",title:"Bayrağa tırman",text:`<p>Robo bayrağa ulaşmak istiyor ama sadece ${P("motion","x'i 10 değiştir")} ve ${P("motion","y'yi 10 değiştir")} bloklarını kullanabilirsin. Döngüyle kısaltmayı unutma!</p>`,setup:{backdrop:"koordinat",sprites:[G("Bayrak","bayrak",150,100),G("Robo","robo",-150,-100)]},blocks:["flag","chx","chy","repeat","wait"],goals:[{t:"“x'i değiştir” kullan",use:"chx"},{t:"“y'yi değiştir” kullan",use:"chy"},{t:"Robo bayrağa ulaşsın 🏁",f:e=>e.touching("Robo","Bayrak")}],hint:"Bayrak 300 adım sağda, 200 adım yukarıda. 10 kez [x'i 30 değiştir], sonra 10 kez
