server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bot taramaları (.env, .git, php, wp-admin vb.): sessizce 404 dön, loga yazma.
    # Bu siteyi etkilemez; yalnızca log gürültüsünü keser.
    location ~ /\.(?!well-known) { access_log off; log_not_found off; return 404; }
    location ~* \.(php|asp|aspx|jsp|cgi|sql|bak|old|swp|env)$ { access_log off; log_not_found off; return 404; }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|phpmyadmin|cgi-bin|vendor|admin|administrator)(/|$) { access_log off; log_not_found off; return 404; }

    # Yalnızca GET ve HEAD'e izin ver (POST ile gelen taramalar 405 olarak loga düşmesin).
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Ders sayfaları, görseller, yazı tipleri: tarayıcı önbelleği
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Küçük güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
